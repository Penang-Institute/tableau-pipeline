# Site dashboard -> Tableau Public workbook -> the data it is built from.
# Read by freshness_check.py. One entry per page in pistats/dashboards/.
#
# feed: opendosm (weekly sync), manual (Hajar drops/edits), mixed, untracked
# source kinds: sheet (optionally limited to tabs), folder, file (Drive IDs,
# same IDs as pipeline/config/google_sheets_registry.yaml)
# archived: true = page lives under dashboards/archive; reported, never fails the run.

main_workbook: &main "1cJe-flqOiDEA9Q9MFe2LCIcY8PmmEc_M3mt-TD7eKQM"

dashboards:
  - page: econ/cpi
    title: Consumer Price Index
    workbook: ConsumerPriceIndex_16506163722350
    view: ConsumerPriceIndex
    feed: opendosm
    sources:
      - {name: CPI opendosm folder, folder: "1_1FRwXto-o0B2udDH7EmDkfCBQJjcIA5"}

